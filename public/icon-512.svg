<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Arka Plan -->
  <rect width="512" height="512" fill="url(#grad2)" rx="120"/>
  
  <!-- Dış Halka -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.15"/>
  
  <!-- Ana Sembol -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- Üst Üçgen - Yönetim -->
    <path d="M 0,-95 L 82,40 L -82,40 Z" fill="#10b981" opacity="0.95" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Orta Daire - Merkez -->
    <circle cx="0" cy="15" r="50" fill="#06b6d4" opacity="0.9" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Alt Üçgen - İstatistikler -->
    <path d="M 0,95 L 68,-15 L -68,-15 Z" fill="#f59e0b" opacity="0.9" stroke="#ffffff" stroke-width="3"/>
    
    <!-- İç Yapı - Çizgiler -->
    <line x1="-40" y1="-20" x2="40" y2="-20" stroke="#ffffff" stroke-width="4" opacity="0.4"/>
    <line x1="-50" y1="50" x2="50" y2="50" stroke="#ffffff" stroke-width="4" opacity="0.4"/>
  </g>
  
  <!-- Köşe Aksentleri -->
  <circle cx="80" cy="80" r="20" fill="#10b981" opacity="0.7"/>
  <circle cx="432" cy="80" r="20" fill="#06b6d4" opacity="0.7"/>
  <circle cx="80" cy="432" r="20" fill="#f59e0b" opacity="0.7"/>
  <circle cx="432" cy="432" r="20" fill="#10b981" opacity="0.7"/>
  
  <!-- Metin -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.3">AKN</text>
</svg>
