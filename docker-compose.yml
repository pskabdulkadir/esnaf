version: '3.8'

services:
  siftah:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siftah-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PRODUCTION_URL=${PRODUCTION_URL:-http://localhost:3000}
      - GOOGLE_ANALYTICS_ID=${GOOGLE_ANALYTICS_ID}
      - GOOGLE_ADS_ID=${GOOGLE_ADS_ID}
    volumes:
      # Mount data directory for persistent storage
      - ./db_data.json:/app/db_data.json
      - ./db_backups:/app/.backups
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
